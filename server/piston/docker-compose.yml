# Self-hosted Piston (code execution engine) backing the "Run Code" feature.
# The public Piston API now requires a whitelist, so this replaces it for local/dev use.
#
# Setup:
#   1. docker compose -f server/piston/docker-compose.yml up -d
#   2. Install the language runtimes you need, e.g.:
#        curl -X POST http://localhost:2000/api/v2/packages \
#          -H "Content-Type: application/json" \
#          -d '{"language":"python","version":"3.12.0"}'
#      Run `curl http://localhost:2000/api/v2/packages` to see available language/version pairs.
#   3. server/.env already points PISTON_API_URL at http://localhost:2000/api/v2
services:
  api:
    image: ghcr.io/engineer-man/piston
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./piston_data/packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec
    environment:
      # Piston's default output_max_size is 1024 bytes per stdio buffer. The Python
      # tracer harness (server/src/utils/pythonTracer.js) prints the entire step-by-step
      # trace as one JSON blob, which blows past that for anything beyond a few
      # straight-line statements — Piston silently kills the sandbox ("stdout length
      # exceeded" in its own logs), which surfaces to us as a confusing
      # "Sandbox keeper received fatal signal 6" crash. Raise it well above the
      # tracer's own worst-case bound (MAX_STEPS=500 * MAX_HEAP_OBJECTS=150).
      - PISTON_OUTPUT_MAX_SIZE=8388608
